[plugin]
slug = "ollama"
name = "Ollama"
kind = "provider"
api_version = "1"

[build]
dockerfile = "Dockerfile"

[ports.api]
internal = 11434
default = 11434
env_var = "OLLAMA_PORT"
legacy_slug = "ollama"

[environment]
OLLAMA_BASE_URL = "http://localhost:${OLLAMA_PORT:-11434}/v1"
OPENAI_BASE_URL = "http://localhost:${OLLAMA_PORT:-11434}/v1"
