[plugin]
slug = "gpt4all"
name = "GPT4All"
kind = "provider"
api_version = "1"

[build]
dockerfile = "Dockerfile"

[ports.api]
internal = 4891
default = 4891
env_var = "GPT4ALL_PORT"
legacy_slug = "gpt4all"

[environment]
GPT4ALL_BASE_URL = "http://localhost:${GPT4ALL_PORT:-4891}/v1"
OPENAI_BASE_URL = "http://localhost:${GPT4ALL_PORT:-4891}/v1"
