[plugin]
slug = "lmstudio"
name = "LM Studio"
kind = "provider"
api_version = "1"

[build]
dockerfile = "Dockerfile"

[ports.api]
internal = 1234
default = 1234
env_var = "LM_STUDIO_PORT"
legacy_slug = "lm-studio"

[environment]
LM_STUDIO_BASE_URL = "http://localhost:${LM_STUDIO_PORT:-1234}/v1"
OPENAI_BASE_URL = "http://localhost:${LM_STUDIO_PORT:-1234}/v1"
